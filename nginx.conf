# Dedicated JBRemote virtual host. Keep the Laravel virtual host unchanged.
server {
    listen 80;
    server_name jbdesk.18.117.163.80.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/jbremote-acme; }
    location / { return 308 https://jbdesk.18.117.163.80.sslip.io$request_uri; }
}
server {
    listen 3000;
    server_name _;
    return 308 https://jbdesk.18.117.163.80.sslip.io$request_uri;
}
server {
    listen 443 ssl;
    server_name jbdesk.18.117.163.80.sslip.io;
    ssl_certificate /etc/letsencrypt/live/jbdesk.18.117.163.80.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jbdesk.18.117.163.80.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        client_max_body_size 6m;
    }
}
